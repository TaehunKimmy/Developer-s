<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>OCR 이미지 번역</title>
</head>

<body>
    <h1>이미지 텍스트 번역기</h1>
    <input type="file" id="imageInput" accept="image/*" />
    <button onclick="uploadImage()">번역하기</button>
    <pre id="result"></pre>

    <script>
        async function uploadImage() {
            const input = document.getElementById('imageInput');
            const file = input.files[0];
            if (!file) return alert('이미지를 선택하세요');

            const formData = new FormData();
            formData.append('image', file);

            const res = await fetch('http://localhost:3000/translate-image', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            document.getElementById('result').textContent = data.translatedText || data.error;
        }
    </script>
</body>

</html>
