    <script>
        function populateDateSelects(prefix, defaultDate) {
            var yearSelect = document.getElementById(prefix + '-year');
            var monthSelect = document.getElementById(prefix + '-month');
            var daySelect = document.getElementById(prefix + '-day');
            var currentYear = new Date().getFullYear();
            for (var y = currentYear - 5; y <= currentYear + 5; y++) {
                var opt = document.createElement('option');
                opt.value = y;
                opt.text = y + "년";
                yearSelect.appendChild(opt);
            }
            for (var m = 1; m <= 12; m++) {
                var opt = document.createElement('option');
                opt.value = m;
                opt.text = m + "월";
                monthSelect.appendChild(opt);
            }
            for (var d = 1; d <= 31; d++) {
                var opt = document.createElement('option');
                opt.value = d;
                opt.text = d + "일";
                daySelect.appendChild(opt);
            }
            yearSelect.value = defaultDate.getFullYear();
            monthSelect.value = defaultDate.getMonth() + 1;
            daySelect.value = defaultDate.getDate();
        }

        document.addEventListener("DOMContentLoaded", function () {
            var today = new Date();
            populateDateSelects("issue", today);
            populateDateSelects("start", today);
            populateDateSelects("end", today);
        });
